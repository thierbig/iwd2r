          sudo apt-get install -y build-essential cmake ninja-build clang pkg-config libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libdecor-0-dev libudev-dev libdbus-1-dev libpipewire-0.3-dev mesa-vulkan-drivers
      - name: Choose dependency directory
        shell: bash
        run: echo "FETCH_DIR=$(echo "$RUNNER_TEMP" | tr '\\' '/')/fetch" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.FETCH_DIR }}
          key: fetch-${{ runner.os }}-linux-clang-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: cmake --preset linux-clang -DFETCHCONTENT_BASE_DIR="${{ env.FETCH_DIR }}"
      - name: Build
